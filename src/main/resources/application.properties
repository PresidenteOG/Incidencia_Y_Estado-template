spring.application.name=incident-tracker

# Honour the port a host hands us (Render, Railway, Fly all set $PORT); fall back to 8080 locally.
server.port=${PORT:8080}

# In-memory H2. The schema is rebuilt and re-seeded from data.sql on every start,
# so the app always opens on the same populated demo. Changes made in the UI last
# until the next restart.
spring.datasource.url=jdbc:h2:mem:incidenciasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Run data.sql after Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:incidenciasdb)
# On locally it is handy; the deployed instance sets H2_CONSOLE=false so the console
# is not exposed on a public URL.
spring.h2.console.enabled=${H2_CONSOLE:true}
