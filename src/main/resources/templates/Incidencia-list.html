<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Lista de Incidencias</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    a {
      text-decoration: none;
      color: #fff;
      background: #4e72ff;
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 14px;
      transition: .2s;
      margin-right: 8px;
    }

    a:hover {
      background: #3b5ee6;
    }

    .top-actions {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 95%;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    th {
      background: #4e72ff;
      color: white;
      padding: 10px;
      font-weight: 600;
      font-size: 14px;
    }

    td {
      padding: 10px;
      font-size: 13px;
      color: #333;
      border-bottom: 1px solid #ddd;
    }

    tr:nth-child(even) {
      background: #f7f9fc;
    }

    tr:hover {
      background: #e4ebfa;
    }

    td a {
      margin: 0 2px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .bottom-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      background: #28a745;
    }

    .bottom-link:hover {
      background: #1b8a36;
    }
  </style>
</head>

<body>
  <h1>Lista de Incidencias</h1>

  <div class="top-actions">
    <a th:href="@{/Incidencia-add}">Añadir Incidencia</a>
    <a th:href="@{/logout}" style="background:#6b7280;">Cerrar sesión</a>
  </div>

  <table>
    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Descripción</th>
      <th>Apertura</th>
      <th>Cierre</th>
      <th>Tiempo Resolución</th>
      <th>Estado</th>
      <th>Prioridad</th>
      <th>Acciones</th>
    </tr>

    <tr th:each="incidencia : ${incidencias}">
      <td th:text="${incidencia.id}"></td>
      <td th:text="${incidencia.titol}"></td>
      <td th:text="${incidencia.descripcion}"></td>
      <td th:text="${incidencia.data_obertura}"></td>
      <td th:text="${incidencia.data_tancament}"></td>
      <td th:text="${incidencia.temps_resolucio}"></td>
      <td th:text="${incidencia.estado != null ? incidencia.estado.nombre : '—'}"></td>
      <td th:text="${incidencia.prioritat}"></td>

      <td>
        <a th:href="@{'/Incidencia/updateData/' + ${incidencia.id}}">Editar</a>
        <a th:href="@{'/Incidencia/deleteData/' + ${incidencia.id}}"
           style="background:#d9534f;">Eliminar</a>
      </td>
    </tr>
  </table>

  <a class="bottom-link" th:href="@{/Estado-list}">Gestionar Estados</a>

</body>
</html>
