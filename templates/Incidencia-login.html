<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            width: 360px;
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            animation: fadeIn .3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            color: #2d3748;
            font-size: 26px;
            letter-spacing: 0.6px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #bfc5d2;
            font-size: 15px;
            transition: .25s;
        }

        input:focus {
            outline: none;
            border-color: #4c84f3;
            box-shadow: 0 0 6px rgba(76,132,243,0.5);
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 12px;
            background: #4c84f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .08s;
        }

        button:hover {
            background: #3f71d4;
        }

        button:active {
            transform: scale(.98);
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Iniciar Sesión</h1>

    <form th:action="@{/Incidencia/login}" method="post">
        <label for="Name">Nombre:</label>
        <input type="text" id="Name" name="Name" required>

        <label for="Password">Contraseña:</label>
        <input type="password" id="Password" name="Password" required>

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
