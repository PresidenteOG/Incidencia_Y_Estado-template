<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Add incidencia</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 25px 35px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      width: 350px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 5px;
      transition: 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #4979ff;
      box-shadow: 0 0 4px rgba(73,121,255,0.4);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: #4979ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #2e63ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Agregar Incidencia</h2>

    <form th:object="${incidencia}" th:action="@{/Incidencia}" method="post">
      <input type="hidden" th:field="*{id}" />

      <label for="titol">Titulo:</label>
      <input type="text" id="titol" th:field="*{titol}" required/>

      <label for="descripcion">Descripcion:</label>
      <input type="text" id="descripcion" th:field="*{descripcion}" required/>

      <label for="prioritat">Prioridad:</label>
      <select id="prioritat" th:field="*{prioritat}">
        <option value="BAIXA">BAIXA</option>
        <option value="MITJA">MITJA</option>
        <option value="ALTA">ALTA</option>
      </select>

      <button type="submit">Guardar</button>
    </form>
  </div>
</body>
</html>
