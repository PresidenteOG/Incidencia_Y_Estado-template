<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #e9eef4;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: #fff;
      padding: 30px 35px;
      border-radius: 12px;
      width: 360px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-size: 26px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 4px;
      font-weight: 600;
      color: #555;
    }

    input {
      width: 100%;
      padding: 9px 10px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
      transition: .2s;
    }

    input:focus {
      outline: none;
      border-color: #4e72ff;
      box-shadow: 0 0 4px rgba(78,114,255,.45);
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: #4e72ff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #3f63f5;
    }

    button:active {
      transform: scale(.97);
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h1>Login</h1>

    <form th:object="${Incidencia}" th:action="@{/Incidencia}" method="post">
      <input type="hidden" th:field="*{id}" />

      <label for="Name">Nombre:</label>
      <input type="text" id="Name" name="Name" th:field="*{Name}" required />

      <label for="Surname">Apellido:</label>
      <input type="text" id="Surname" name="Surname" th:field="*{Surname}" required />

      <label for="Phone">Teléfono:</label>
      <input type="text" id="Phone" name="Phone" th:field="*{Phone}" required />

      <label for="Email">Email:</label>
      <input type="text" id="Email" name="Email" th:field="*{Email}" required />

      <button type="submit">Buscar</button>
    </form>
  </div>
</body>
</html>
